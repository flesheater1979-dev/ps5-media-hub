name: Native PS5 test build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build pinned toolchain image
        run: docker compose build
      - name: Host unit tests
        run: docker compose run --rm ps5-dev ./tests/run_tests.sh
      - name: Companion offline tests
        run: python3 companion/test_companion.py
      - name: Build exact media dependencies
        run: docker compose run --rm ps5-dev ./scripts/build-ffmpeg.sh --profile minimal --install
      - name: Compile and package native application
        run: docker compose run --rm ps5-dev ./scripts/package-app.sh --ffpfsc --zip
      - name: Export verified artifacts and manifest
        run: python3 tools/export_hub_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-media-hub-hardware-UNTESTED
          path: dist/
          if-no-files-found: error
